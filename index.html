<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Вердикт OK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Макет: лист тетради в клетку. Шапка с вкладками разделов, под ней одна колонка до 1080px.
   Задачи выглядят как таблица судейской системы, вердикты — как штампы OK / WA / TLE. */
:root {
  --paper: #f3f6fc;      /* клетка тетради */
  --grid: #dde4f4;
  --sheet: #ffffff;      /* листы-карточки */
  --sheet-2: #f7f9fe;
  --ink: #141d33;
  --muted: #56627f;
  --line: #ccd5eb;
  --pen: #2440c4;        /* синяя ручка — единственный акцент */
  --pen-ink: #ffffff;
  --pen-soft: #e6ebfd;
  --ok: #0d7a42;  --ok-soft: #dcf2e5;
  --wa: #bf2638;  --wa-soft: #fbe3e7;
  --tle: #93570a; --tle-soft: #f9edd7;
  --cls-a: #2d6ae0; --cls-b: #de7418;
  --code-bg: #eef2fb;
  --f-display: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1220; --grid: #182038; --sheet: #141b2e; --sheet-2: #18203a;
    --ink: #e5eaf7; --muted: #9ba7c6; --line: #2a3454;
    --pen: #93a8ff; --pen-ink: #0d1220; --pen-soft: #1f2a55;
    --ok: #52d68b; --ok-soft: #12372a; --wa: #ff8090; --wa-soft: #3e1821; --tle: #f2b552; --tle-soft: #3a2a10;
    --cls-a: #6d9eff; --cls-b: #ffa45a; --code-bg: #10172a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1220; --grid: #182038; --sheet: #141b2e; --sheet-2: #18203a;
  --ink: #e5eaf7; --muted: #9ba7c6; --line: #2a3454;
  --pen: #93a8ff; --pen-ink: #0d1220; --pen-soft: #1f2a55;
  --ok: #52d68b; --ok-soft: #12372a; --wa: #ff8090; --wa-soft: #3e1821; --tle: #f2b552; --tle-soft: #3a2a10;
  --cls-a: #6d9eff; --cls-b: #ffa45a; --code-bg: #10172a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font: 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h2 { font: 700 1.5rem/1.2 var(--f-display); letter-spacing: -0.01em; }
h3 { font-size: 1.12rem; font-weight: 600; }
p { margin: 0; }
code, pre, kbd { font-family: var(--f-mono); font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 4px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; overflow-x: auto; margin: 0; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: 0.86rem; }
.eyebrow { font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- шапка ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--sheet); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1080px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font: 700 0.95rem/1 var(--f-display); }
.brand .stamp-mini { font: 600 0.7rem/1 var(--f-mono); color: var(--ok); border: 1.5px solid var(--ok); padding: 3px 5px; border-radius: 3px; transform: rotate(-6deg); }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; }
.nav a {
  text-decoration: none; color: var(--muted); font-weight: 500; padding: 8px 12px; border-radius: var(--r);
  white-space: nowrap; border-bottom: 2px solid transparent;
}
.nav a:hover { color: var(--ink); background: var(--sheet-2); }
.nav a[aria-current="page"] { color: var(--pen); background: var(--pen-soft); }
.tour-chip { font: 600 0.8rem/1 var(--f-mono); color: var(--tle); background: var(--tle-soft); padding: 6px 9px; border-radius: 99px; text-decoration: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.grade-pick select {
  font: 600 0.85rem/1 var(--f-body); color: var(--pen); background: var(--pen-soft); border: 1px solid transparent;
  border-radius: 99px; padding: 7px 10px; cursor: pointer;
}
.grade-pick select:hover { border-color: var(--pen); }
.gchip { font: 600 0.7rem/1 var(--f-mono); color: var(--muted); border: 1px solid var(--line); padding: 3px 6px; border-radius: 99px; white-space: nowrap; }
.grades { display: flex; gap: 8px; flex-wrap: wrap; }
.grades button {
  appearance: none; font: 700 1.15rem/1 var(--f-display); flex: 1 1 0; min-width: 40px; max-width: 64px; height: 56px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--sheet-2); color: var(--ink); cursor: pointer;
}
.grades button:hover { border-color: var(--pen); color: var(--pen); }
.grades button[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); }
.older { opacity: 0.62; }
.older-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.older-head h3 { font-size: 1rem; }
.gen-sep { font: 600 0.68rem/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 12px 10px 4px; white-space: nowrap; align-self: center; }
main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
main > * { min-width: 0; }
@media (max-width: 520px) { .col-topic { display: none; } }

/* ---------- общие элементы ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
  font: 500 0.95rem/1 var(--f-body); padding: 10px 14px; border-radius: var(--r); cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--pen); color: var(--pen); }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--pen-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: var(--pen-ink); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.small { padding: 7px 10px; font-size: 0.85rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; min-width: 0; }
.pill { font: 600 0.72rem/1 var(--f-mono); padding: 4px 7px; border-radius: 4px; letter-spacing: 0.04em; white-space: nowrap; }
.v-ok { color: var(--ok); background: var(--ok-soft); }
.v-wa, .v-re, .v-ce { color: var(--wa); background: var(--wa-soft); }
.v-tle { color: var(--tle); background: var(--tle-soft); }
.v-none { color: var(--muted); background: var(--sheet-2); }
.bar { height: 6px; background: var(--sheet-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pen); border-radius: 99px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 600 0.72rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); }
td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }

/* ---------- главная ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.hero h1 { font: 700 clamp(2.4rem, 7vw, 4.6rem)/1 var(--f-display); letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.25em; flex-wrap: wrap; }
.stamp {
  font: 600 0.62em/1 var(--f-mono); color: var(--ok); border: 0.08em solid var(--ok); border-radius: 0.12em;
  padding: 0.12em 0.22em; transform: rotate(-7deg); display: inline-block; letter-spacing: 0.02em;
  animation: stamp 0.5s cubic-bezier(.2,1.6,.4,1) both;
}
@keyframes stamp { from { transform: rotate(-7deg) scale(1.6); } to { transform: rotate(-7deg) scale(1); } }
.hero .lead { font-size: 1.12rem; max-width: 34em; margin-top: 18px; color: var(--muted); }
.hero .lead b { color: var(--ink); font-weight: 600; }
.judge { font-family: var(--f-mono); font-size: 0.84rem; }
.judge .jh { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.judge table td { padding: 7px 8px; }
.judge table th { padding: 7px 8px; }
.sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.sec-card { display: grid; gap: 12px; text-decoration: none; color: var(--ink); align-content: start; transition: border-color .15s, transform .15s; }
.sec-card:hover { border-color: var(--pen); transform: translateY(-2px); }
.sec-card .sym { font: 600 1.4rem/1 var(--f-mono); color: var(--pen); }
.sec-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.93rem; }
.kv { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: wk; }
.plan li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; }
.plan .wk { font: 600 0.75rem/1.4 var(--f-mono); color: var(--pen); text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
.tips { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.links a { display: grid; gap: 2px; text-decoration: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet-2); }
.links a:hover { border-color: var(--pen); }
.links a b { color: var(--ink); font-weight: 600; }
.links a span { color: var(--muted); font-size: 0.85rem; }

/* ---------- раздел ---------- */
.sec-head { display: grid; gap: 10px; }
.sec-head h1 { font: 700 clamp(1.7rem, 4.5vw, 2.6rem)/1.1 var(--f-display); letter-spacing: -0.02em; }
.sec-head p { max-width: 46em; color: var(--muted); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 10px 14px; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--pen); border-bottom-color: var(--pen); }

/* теория */
.topics { display: grid; gap: 10px; }
details.topic { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--r); }
details.topic > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
details.topic > summary::-webkit-details-marker { display: none; }
details.topic > summary .tt { font-weight: 600; font-size: 1.05rem; flex: 1; min-width: 0; }
details.topic > summary .chev { font-family: var(--f-mono); color: var(--muted); transition: transform .2s; }
details.topic[open] > summary .chev { transform: rotate(90deg); }
details.topic[open] > summary { border-bottom: 1px solid var(--line); }
.topic .body { padding: 18px; display: grid; gap: 14px; max-width: 760px; }
.topic .body ul, .topic .body ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.topic .body table { font-size: 0.92rem; }
.note { border-left: 3px solid var(--pen); background: var(--pen-soft); padding: 10px 14px; border-radius: 0 var(--r) var(--r) 0; }
.read-mark { font: 600 0.72rem/1 var(--f-mono); color: var(--ok); }
.read-btn { justify-self: start; }

/* тренажёр */
.trainer { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
.gen-list { display: grid; gap: 4px; }
.gen-list button {
  appearance: none; text-align: left; border: 1px solid transparent; background: none; color: var(--muted);
  font: 500 0.92rem/1.3 var(--f-body); padding: 8px 10px; border-radius: var(--r); cursor: pointer;
}
.gen-list button:hover { color: var(--ink); background: var(--sheet); }
.gen-list button[aria-pressed="true"] { color: var(--pen); background: var(--pen-soft); }
.qcard { display: grid; gap: 16px; }
.qcard .qtext { font-size: 1.08rem; }
.qcard .qtext pre { margin-top: 10px; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
.answer-row input {
  flex: 1 1 200px; min-width: 0; font: 500 1.05rem/1 var(--f-mono); padding: 11px 12px; border: 1px solid var(--line);
  border-radius: var(--r); background: var(--sheet-2); color: var(--ink);
}
.answer-row input:focus { outline: 2px solid var(--pen); outline-offset: 0; border-color: transparent; }
.choices { display: grid; gap: 8px; }
.choices button {
  appearance: none; text-align: left; border: 1px solid var(--line); background: var(--sheet-2); color: var(--ink);
  font: 400 1rem/1.4 var(--f-body); padding: 11px 14px; border-radius: var(--r); cursor: pointer;
}
.choices button:hover:not(:disabled) { border-color: var(--pen); }
.choices button.is-right { border-color: var(--ok); background: var(--ok-soft); }
.choices button.is-wrong { border-color: var(--wa); background: var(--wa-soft); }
.feedback { border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.feedback.good { background: var(--ok-soft); }
.feedback.bad { background: var(--wa-soft); }
.feedback .fh { font: 600 0.9rem/1 var(--f-mono); }
.feedback.good .fh { color: var(--ok); }
.feedback.bad .fh { color: var(--wa); }
.score { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.9rem; color: var(--muted); }
.score b { color: var(--ink); font-family: var(--f-mono); }
.tt-table td, .tt-table th { padding: 4px 10px; text-align: center; font-family: var(--f-mono); }
.tt-table tr.hit td { background: var(--ok-soft); }

/* задачи */
.lv { font-family: var(--f-mono); color: var(--pen); letter-spacing: 1px; white-space: nowrap; }
.lv i { color: var(--line); font-style: normal; }
.task-link { font-weight: 600; text-decoration: none; color: var(--ink); }
.task-link:hover { color: var(--pen); }
.task-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
.statement { display: grid; gap: 14px; }
.statement h1 { font: 700 1.6rem/1.15 var(--f-display); letter-spacing: -0.02em; }
.statement h3 { font-size: 0.78rem; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.limits { font: 0.8rem/1.4 var(--f-mono); color: var(--muted); }
.sample { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.sample pre { font-size: 0.82rem; max-height: 220px; }
.sample .cap { font: 600 0.7rem/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.ide { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--code-bg); overflow: hidden; }
.editor .gut { font: 0.86rem/1.55 var(--f-mono); color: var(--muted); padding: 12px 8px 12px 12px; text-align: right; user-select: none; white-space: pre; opacity: 0.7; overflow: hidden; }
.editor textarea {
  border: 0; resize: vertical; min-height: 300px; background: transparent; color: var(--ink);
  font: 0.86rem/1.55 var(--f-mono); padding: 12px 12px 12px 6px; tab-size: 4; white-space: pre; overflow: auto; outline: none;
}
.io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.io textarea, .io pre { font: 0.82rem/1.45 var(--f-mono); min-height: 92px; max-height: 200px; width: 100%; }
.io textarea { border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet-2); color: var(--ink); padding: 8px 10px; resize: vertical; }
.io pre { white-space: pre-wrap; word-break: break-word; overflow: auto; padding: 8px 10px; }
.io .cap { font: 600 0.7rem/1 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.verdict { display: grid; gap: 10px; }
.verdict .big { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.verdict .big .pill { font-size: 0.95rem; padding: 7px 11px; }
.tests { display: flex; flex-wrap: wrap; gap: 5px; }
.tests span { font: 600 0.72rem/1 var(--f-mono); width: 30px; height: 26px; display: grid; place-items: center; border-radius: 4px; }
.fail-box { display: grid; gap: 6px; font-size: 0.9rem; }
.fail-box pre { font-size: 0.8rem; max-height: 160px; white-space: pre-wrap; }
.reveal { display: grid; gap: 10px; }

/* лаборатория */
.lab { display: grid; gap: 14px; }
.lab canvas { width: 100%; height: 340px; display: block; border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet-2); cursor: crosshair; touch-action: manipulation; }
.ctrl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 0.92rem; }
.ctrl label { display: flex; gap: 8px; align-items: center; }
.ctrl input[type=range] { width: 150px; accent-color: var(--pen); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--sheet); color: var(--muted); padding: 8px 12px; font: 500 0.88rem/1 var(--f-body); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--pen-soft); color: var(--ink); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.status-line { font: 0.88rem/1.4 var(--f-mono); }

.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--tle-soft); padding: 10px 12px; border-radius: var(--r); }

@media (max-width: 860px) {
  .hero, .two, .task-grid, .trainer { grid-template-columns: minmax(0, 1fr); }
  .sections { grid-template-columns: minmax(0, 1fr); }
  .ide { position: static; }
  .gen-list { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
}
@media (max-width: 520px) {
  .sample, .io { grid-template-columns: minmax(0, 1fr); }
  .top-in { gap: 6px; padding-block: 8px; }
  .nav { margin-left: 0; width: 100%; }
  .nav a { padding: 7px 10px; }
  .plan li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .sheet { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><span class="stamp-mini">OK</span>Вердикт</a>
    <a class="tour-chip" id="tourChip" href="#home" hidden></a>
    <label class="grade-pick"><span class="sr">Класс</span><select id="gradeSel" aria-label="Класс">
      <option value="">все классы</option>
      <option value="6">6 класс</option><option value="7">7 класс</option><option value="8">8 класс</option>
      <option value="9">9 класс</option><option value="10">10 класс</option><option value="11">11 класс</option>
    </select></label>
    <nav class="nav" aria-label="Разделы">
      <a href="#home" data-nav="home">Старт</a>
      <a href="#algo" data-nav="algo">Алгоритмы</a>
      <a href="#theory" data-nav="theory">Теория</a>
      <a href="#ai" data-nav="ai">ИИ</a>
    </nav>

 "inp": "Первая строка: <i>n<\/i>. Вторая: <i>n<\/i> входов. Третья: <i>n<\/i> весов. Четвёртая: смещение <i>b<\/i>. Все числа вещественные.", "out": "Два числа через пробел с четырьмя знаками после запятой: ReLU(z) и σ(z), где z = Σ w<sub>i<\/sub>x<sub>i<\/sub> + b.", "hint": "ReLU(z) = max(0, z). Сигмоида σ(z) = 1 / (1 + e<sup>−z<\/sup>), экспонента — <code>math.exp<\/code>.", "solution": "import math\nn = int(input())\nx = list(map(float, input().split()))\nw = list(map(float, input().split()))\nb = float(input())\nz = b\nfor i in range(n):\n    z += w[i] * x[i]\nrelu = max(0.0, z)\nsig = 1 / (1 + math.exp(-z))\nprint(f\"{relu:.4f} {sig:.4f}\")", "why": "Это и есть вся математика одного нейрона: взвешенная сумма плюс нелинейность. Сеть — это много таких нейронов слоями. Без нелинейности (ReLU, сигмоиды) любая многослойная сеть схлопнулась бы в одну линейную функцию.", "tests": [{"in": "3\n1 2 3\n0.5 -1 0.25\n0.1", "out": "0.0000 0.3430"}, {"in": "2\n1 1\n-2 -3\n1", "out": "0.0000 0.0180"}, {"in": "1\n0\n5\n0", "out": "0.0000 0.5000"}, {"in": "4\n0.5 -1.5 2 3\n1 2 -0.5 0.25\n-0.3", "out": "0.0000 0.0452"}], "g": 9}, {"id": "ai-knn", "sec": "ai", "topic": "k ближайших соседей", "level": 2, "title": "Ближайший сосед", "text": "Даны <i>n<\/i> точек на плоскости с известным классом (метка — слово). Для каждой из <i>q<\/i> новых точек предскажите класс методом одного ближайшего соседа (1-NN): возьмите класс самой близкой обучающей точки. Если ближайших несколько, берите ту, что раньше во вводе.", "inp": "Первая строка: <i>n<\/i>. Далее <i>n<\/i> строк: <i>x<\/i> <i>y<\/i> метка. Затем <i>q<\/i> и <i>q<\/i> строк по два числа <i>x<\/i> <i>y<\/i>. Координаты целые.", "out": "<i>q<\/i> строк — предсказанные метки.", "hint": "Расстояние сравнивайте в квадрате: (x₁−x₂)² + (y₁−y₂)². Корень не нужен, порядок от него не меняется, а вещественных погрешностей не будет.", "solution": "n = int(input())\ntrain = []\nfor _ in range(n):\n    x, y, lab = input().split()\n    train.append((int(x), int(y), lab))\nq = int(input())\nfor _ in range(q):\n    x, y = map(int, input().split())\n    best = None\n    best_d = None\n    for tx, ty, lab in train:\n        d = (tx - x) ** 2 + (ty - y) ** 2\n        if best_d is None or d < best_d:\n            best_d = d\n            best = lab\n    print(best)", "why": "k-NN не обучается заранее: он просто хранит все примеры и при каждом вопросе ищет ближайшие. Чем больше k, тем «спокойнее» граница между классами и тем меньше она реагирует на случайные выбросы. Признаки с разным масштабом (рост в см и возраст в годах) перед k-NN нормализуют.", "tests": [{"in": "3\n0 0 кот\n10 10 пёс\n0 10 кот\n3\n1 1\n9 8\n5 5", "out": "кот\nпёс\nкот"}, {"in": "1\n5 5 A\n2\n0 0\n100 -100", "out": "A\nA"}, {"in": "10\n33 16 B\n-27 18 A\n7 -48 A\n1 -13 C\n-26 17 A\n44 -45 A\n13 -13 B\n29 -14 A\n35 8 A\n39 49 B\n10\n-16 -54\n58 58\n16 -10\n33 48\n3 2\n17 -33\n41 -20\n22 34\n43 -21\n-35 -9", "out": "A\nB\nB\nB\nC\nA\nA\nB\nA\nA"}, {"in": "200\n-39 -11 C\n15 -10 B\n36 -20 A\n5 19 B\n32 46 C\n-39 27 A\n-37 -24 A\n-16 31 A\n50 -28 C\n-28 10 A\n42 -43 C\n-20 -3 B\n-14 -23 B\n-47 9 B\n4 -27 A\n-21 44 A\n-34 -39 A\n-19 -25 C\n-17 -50 A\n42 12 B\n-17 -48 A\n1 -35 B\n9 18 C\n33 6 C\n-16 -1 C\n38 34 A\n-19 2 A\n3 -31 A\n-38 -17 B\n35 38 A\n-18 -40 A\n-14 -39 A\n-45 37 A\n16 -3 C\n27 -42 A\n41 -47 B\n6 21 A\n-47 -49 B\n-12 -18 A\n-18 -8 B\n-10 17 C\n-14 -20 B\n18 14 C\n-50 25 C\n-46 -12 C\n22 -21 C\n-26 39 B\n-5 30 A\n-47 -45 B\n-2 -9 C\n-16 -20 A\n27 26 C\n16 -17 C\n-17 10 B\n-2 24 C\n36 8 C\n-25 -5 B\n0 9 A\n46 -22 B\n47 50 B\n16 -25 B\n29 -40 B\n25 -14 A\n-10 0 A\n33 -5 B\n-5 -37 B\n43 -45 C\n28 -35 B\n-14 -41 B\n11 -39 B\n-1 37 C\n46 -14 A\n0 -28 C\n26 39 A\n-12 37 C\n8 -15 A\n-8 24 A\n-47 -31 A\n-1 -15 A\n3 18 B\n-49 13 A\n-35 32 C\n-33 -18 C\n-34 -27 A\n-37 -29 B\n-3 29 B\n-23 -36 B\n47 38 B\n10 30 A\n-37 44 C\n1 -23 C\n-5 -36 B\n-35 -2 C\n47 40 A\n-23 32 A\n24 -48 A\n22 12 C\n8 -36 A\n-30 42 A\n29 23 C\n-39 28 C\n-9 8 A\n18 35 C\n1 nA\nB\nA\nA\nC"}], "g": 9}, {"id": "ai-gd", "sec": "ai", "topic": "Градиентный спуск", "level": 3, "title": "Градиентный спуск", "text": "Обучим линейную регрессию ŷ = w·x + b градиентным спуском. Функция потерь — MSE = (1/n)·Σ(ŷ<sub>i<\/sub> − y<sub>i<\/sub>)². Начинаем с w = 0, b = 0 и делаем <i>k<\/i> шагов с шагом обучения <i>η<\/i>. На каждом шаге градиент считается по всем точкам сразу, а w и b обновляются одновременно.", "inp": "Первая строка: <i>n<\/i>, <i>k<\/i> и <i>η<\/i>. Далее <i>n<\/i> строк по два числа <i>x<\/i> и <i>y<\/i>.", "out": "Числа w и b после <i>k<\/i> шагов, с четырьмя знаками после запятой.", "hint": "∂MSE/∂w = (2/n)·Σ(ŷ<sub>i<\/sub> − y<sub>i<\/sub>)·x<sub>i<\/sub>, ∂MSE/∂b = (2/n)·Σ(ŷ<sub>i<\/sub> − y<sub>i<\/sub>). Обновление: w ← w − η·∂w, b ← b − η·∂b. Оба градиента считайте до обновления.", "solution": "first = input().split()\nn, k, lr = int(first[0]), int(first[1]), float(first[2])\npts = [tuple(map(float, input().split())) for _ in range(n)]\nw = b = 0.0\nfor _ in range(k):\n    gw = gb = 0.0\n    for x, y in pts:\n        e = w * x + b - y\n        gw += 2 * e * x / n\n        gb += 2 * e / n\n    w -= lr * gw\n    b -= lr * gb\nprint(f\"{w:.4f} {b:.4f}\")", "why": "Градиент показывает, куда функция потерь растёт быстрее всего, поэтому шагаем в противоположную сторону. Слишком большой η — значения улетают в бесконечность, слишком маленький — обучение тянется вечно. Типичная ошибка: обновить w и потом считать градиент по b уже с новым w.", "tests": [{"in": "3 1 0.1\n1 2\n2 4\n3 6", "out": "1.8667 0.8000"}, {"in": "3 100 0.05\n1 2\n2 4\n3 6", "out": "1.9032 0.2200"}, {"in": "4 50 0.01\n0 1\n1 3\n2 5\n3 7", "out": "1.9929 0.9497"}, {"in": "2 10 0.1\n1 1\n-1 -1", "out": "0.8926 0.0000"}], "g": 10}, {"id": "ai-kmeans", "sec": "ai", "topic": "Кластеризация", "level": 3, "title": "Шаг k-средних", "text": "Сделайте одну итерацию алгоритма k-means. Даны <i>n<\/i> точек и <i>k<\/i> текущих центров. Сначала каждая точка относится к ближайшему центру (при равенстве — к центру с меньшим номером). Затем каждый центр переносится в среднее арифметическое своих точек. Если у центра нет точек, он остаётся на месте.", "inp": "Первая строка: <i>n<\/i> и <i>k<\/i>. Далее <i>n<\/i> строк с координатами точек, затем <i>k<\/i> строк с координатами центров. Числа целые.", "out": "<i>k<\/i> строк: новые координаты центров через пробел, с двумя знаками после запятой.", "hint": "Сначала разложите точки по центрам и для каждого центра накопите сумму x, сумму y и количество. Потом поделите.", "solution": "n, k = map(int, input().split())\npts = [tuple(map(int, input().split())) for _ in range(n)]\ncen = [tuple(map(float, input().split())) for _ in range(k)]\nsx = [0.0] * k\nsy = [0.0] * k\ncnt = [0] * k\nfor x, y in pts:\n    best = 0\n    for j in range(1, k):\n        dj = (x - cen[j][0]) ** 2 + (y - cen[j][1]) ** 2\n        db = (x - cen[best][0]) ** 2 + (y - cen[best][1]) ** 2\n        if dj < db:\n            best = j\n    sx[best] += x\n    sy[best] += y\n    cnt[best] += 1\nfor j in range(k):\n    if cnt[j]:\n        print(f\"{sx[j] / cnt[j]:.2f} {sy[j] / cnt[j]:.2f}\")\n    else:\n        print(f\"{cen[j][0]:.2f} {cen[j][1]:.2f}\")", "why": "k-means чередует два шага: «отнести точки к центрам» и «сдвинуть центры в середину своих точек». Повторять, пока центры не перестанут двигаться. Результат зависит от начальных центров, поэтому на практике алгоритм запускают несколько раз.", "tests": [{"in": "4 2\n0 0\n0 2\n10 10\n10 12\n0 1\n9 9", "out": "0.00 1.00\n10.00 11.00"}, {"in": "3 3\n0 0\n1 1\n2 2\n0 0\n100 100\n1 1", "out": "0.00 0.00\n100.00 100.00\n1.50 1.50"}, {"in": "1 1\n5 -5\n0 0", "out": "5.00 -5.00"}, {"in": "15 3\n-29 -26\n-30 -20\n-12 2\n-29 -17\n-19 29\n7 22\n11 20\n-24 4\n0 8\n25 18\n-5 -22\n-2 18\n3 -14\n-11 -28\n22 25\n24 3\n-7 -27\n-10 -13", "out": "12.60 20.60\n-15.00 -25.33\n-15.86 -1.14"}, {"in": "300 5\n-2 -7\n-18 14\n-12 -24\n14 -22\n-21 8\n18 -23\n-19 30\n-15 23\n-11 21\n-29 -3\n-17 8\n-8 10\ ерез пробел: число полных коробок и число оставшихся пирожков.", "hint": "Целочисленное деление в Python — <code>//<\/code>, остаток от деления — <code>%<\/code>.", "solution": "n, k = map(int, input().split())\nprint(n // k, n % k)", "why": "<code>17 // 5 = 3<\/code> — сколько раз 5 целиком помещается в 17. <code>17 % 5 = 2<\/code> — что осталось. Эти две операции встречаются почти в каждой олимпиаде: цифры числа, часы и минуты, чётность.", "tests": [{"in": "17 5", "out": "3 2"}, {"in": "10 10", "out": "1 0"}, {"in": "0 7", "out": "0 0"}, {"in": "3 5", "out": "0 3"}, {"in": "1000000000 1", "out": "1000000000 0"}, {"in": "999999999 1000", "out": "999999 999"}], "g": 6}, {"id": "max3", "sec": "algo", "topic": "Первые шаги", "level": 1, "title": "Самый высокий", "text": "Трое друзей измерили свой рост в сантиметрах. Какой рост у самого высокого из них?", "inp": "Три целых числа через пробел (от 50 до 250).", "out": "Одно число — наибольший рост.", "hint": "Сначала считайте, что самый высокий — первый. Потом сравните его со вторым и с третьим через <code>if<\/code>.", "solution": "a, b, c = map(int, input().split())\nbest = a\nif b > best:\n    best = b\nif c > best:\n    best = c\nprint(best)", "why": "Приём «запомни лучшее и сравни с остальными» потом пригодится для поиска максимума в огромном массиве. В Python есть готовая функция <code>max(a, b, c)<\/code>, но полезно уметь и без неё.", "tests": [{"in": "150 162 158", "out": "162"}, {"in": "170 170 120", "out": "170"}, {"in": "100 100 100", "out": "100"}, {"in": "199 50 60", "out": "199"}, {"in": "50 60 250", "out": "250"}], "g": 6}, {"id": "leap", "sec": "algo", "topic": "Первые шаги", "level": 1, "title": "Високосный год", "text": "Год високосный, если он делится на 4, но не делится на 100, или если он делится на 400. Например, 2024 и 2000 — високосные, а 1900 и 2023 — нет. Определите, високосный ли год.", "inp": "Одно целое число — год (1 ≤ год ≤ 10<sup>5<\/sup>).", "out": "<code>YES<\/code>, если год високосный, иначе <code>NO<\/code>.", "hint": "Число делится на 4, если <code>year % 4 == 0<\/code>. Условия соединяются словами <code>and<\/code> и <code>or<\/code>.", "solution": "y = int(input())\nif (y % 4 == 0 and y % 100 != 0) or y % 400 == 0:\n    print('YES')\nelse:\n    print('NO')", "why": "Сложное условие удобно собрать по частям: «делится на 4 и не делится на 100» <b>или<\/b> «делится на 400». Скобки помогают не перепутать порядок <code>and<\/code> и <code>or<\/code>.", "tests": [{"in": "2024", "out": "YES"}, {"in": "1900", "out": "NO"}, {"in": "2000", "out": "YES"}, {"in": "2023", "out": "NO"}, {"in": "4", "out": "YES"}, {"in": "100", "out": "NO"}, {"in": "400", "out": "YES"}, {"in": "99996", "out": "YES"}], "g": 6}, {"id": "digit-sum", "sec": "algo", "topic": "Циклы", "level": 1, "title": "Сумма цифр", "text": "Найдите сумму цифр натурального числа.", "inp": "Одно целое число <i>n<\/i> (0 ≤ n ≤ 10<sup>18<\/sup>).", "out": "Сумма цифр числа <i>n<\/i>.", "hint": "Последняя цифра — <code>n % 10<\/code>. Чтобы её отрезать, сделайте <code>n //= 10<\/code>. Повторяйте, пока число не станет нулём.", "solution": "n = int(input())\ns = 0\nwhile n > 0:\n    s += n % 10\n    n //= 10\nprint(s)", "why": "Цикл <code>while<\/code> отрезает по одной цифре справа. Другой способ — пройти по строке: <code>sum(int(c) for c in input())<\/code>. Не забудьте случай n = 0: ответ 0.", "tests": [{"in": "123", "out": "6"}, {"in": "0", "out": "0"}, {"in": "9", "out": "9"}, {"in": "1000000000000000000", "out": "1"}, {"in": "999999999999999999", "out": "162"}, {"in": "40506", "out": "15"}], "g": 6}, {"id": "warm-days", "sec": "algo", "topic": "Циклы", "level": 1, "title": "Тёплые дни", "text": "В дневнике погоды записана температура за <i>n<\/i> дней. Сколько дней было теплее нуля?", "inp": "В первой строке <i>n<\/i> (1 ≤ n ≤ 1000). Во второй — <i>n<\/i> целых чисел от −50 до 50.", "out": "Количество дней с температурой больше нуля.", "hint": "Заведите счётчик <code>count = 0<\/code> и увел х это спасает от переполнения. В Python есть готовая <code>math.gcd<\/code>, но на олимпиаде полезно уметь написать её самому.", "tests": [{"in": "12 18", "out": "6 36"}, {"in": "7 13", "out": "1 91"}, {"in": "1 1", "out": "1 1"}, {"in": "1000000000000 999999999999", "out": "1 999999999999000000000000"}, {"in": "48 180", "out": "12 720"}, {"in": "17 17", "out": "17 17"}], "g": 7}, {"id": "clock", "sec": "algo", "topic": "Первые шаги", "level": 2, "title": "Электронные часы", "text": "С начала суток прошло <i>n<\/i> секунд. Что показывают электронные часы? Часы показывают время в формате <code>h:mm:ss<\/code>: часы от 0 до 23 без ведущего нуля, минуты и секунды — всегда двумя цифрами. Если прошло больше суток, часы начинают отсчёт заново.", "inp": "Одно целое число <i>n<\/i> (0 ≤ n ≤ 10<sup>7<\/sup>).", "out": "Время на часах в формате <code>h:mm:ss<\/code>.", "hint": "Секунды на часах — <code>n % 60<\/code>, минуты — <code>n // 60 % 60<\/code>, часы — <code>n // 3600 % 24<\/code>. Двузначный вид даёт <code>f\"{m:02d}\"<\/code>.", "solution": "n = int(input())\nh = n // 3600 % 24\nm = n // 60 % 60\ns = n % 60\nprint(f\"{h}:{m:02d}:{s:02d}\")", "why": "Задача на <code>//<\/code> и <code>%<\/code> и на формат вывода. Частые ошибки: забыть <code>% 24<\/code> (тогда после суток будет 25:00:00) и вывести <code>5:3:7<\/code> вместо <code>5:03:07<\/code>.", "tests": [{"in": "3602", "out": "1:00:02"}, {"in": "129700", "out": "12:01:40"}, {"in": "0", "out": "0:00:00"}, {"in": "86399", "out": "23:59:59"}, {"in": "86400", "out": "0:00:00"}, {"in": "10000000", "out": "17:46:40"}, {"in": "61", "out": "0:01:01"}], "g": 7}, {"id": "range-sums", "sec": "algo", "topic": "Префиксные суммы", "level": 2, "title": "Суммы на отрезках", "text": "Дан массив из <i>n<\/i> чисел и <i>q<\/i> запросов. Каждый запрос — два числа <i>l<\/i> и <i>r<\/i>: выведите сумму элементов с <i>l<\/i>-го по <i>r<\/i>-й включительно. Запросов много, поэтому складывать каждый отрезок заново слишком долго.", "inp     adj[u].append(v)

dist = [-1] * (n + 1)          # BFS: кратчайшие пути в рёбрах

    u = q.popleft()
    for v in adj[u]:

            q.append(v)

<p>В задачах для младших классов часто встречаются <b>исполнители</b> — воображаемые машинки с несколькими командами, а ещё логические головоломки. Решаются они на бумаге, но по-программистски.</p>
<h3>Сколько программ</h3>
<p>Исполнитель Удвоитель умеет две команды: <b>1. Прибавь 1</b> и <b>2. Умножь на 2</b>. Сколько есть программ, которые превращают 1 в 10?</p>

<p>Линейная модель: ŷ = w<sub>1</sub>x<sub>1</sub> + … + w<sub>n</sub>x<sub>n</sub> + b. Обучение — это подбор весов <i>w</i> и смещения <i>b</i>, при которых функция потерь (например, MSE) минимальна.</p>

<li><b>эпоха</b> — один проход по всем данным; <b>батч</b> — порция данных для одного шага; <b>SGD</b> — шаг по одному объекту или маленькому батчу.</li>

function bankGen(sec) {
  return () => {
    const pool = BANK[sec].filter(fits);
    const b = pick(pool.length ? pool : BANK[sec]);
    const order = shuffle(b.o.map((t, i) => i));
    return { kind: "choice", html: b.q, options: order.map(i => b.o[i]), correct: order.indexOf(b.a), explain: b.why };
  };
}
const powersOf2 = n => { const r = []; for (let k = 20; k >= 0; k--) if (n >> k & 1) r.push(2 ** k); return r.join(" + "); };
const sup = n => String(n).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[c]).join("");
const bin8 = n => n.toString(2).padStart(8, "0");

const LOGIC = [
  { s: "(A ∨ B) ∧ ¬C", f: (A, B, C) => (A || B) && !C },
  { s: "A → (B ∧ C)", f: (A, B, C) => !A || (B && C) },
  { s: "¬(A ∧ B) ∨ C", f: (A, B, C) => !(A && B) || C },
  { s: "(A ≡ B) ∨ ¬C", f: (A, B, C) => (A === B) || !C },
  { s: "(A → B) ∧ (B → C)", f: (A, B, C) => (!A || B) && (!B || C) },
  { s: "A ⊕ B ⊕ C", f: (A, B, C) => (A !== B) !== C },
  { s: "¬A ∧ (B ∨ C)", f: (A, B, C) => !A && (B || C) },
  { s: "(A ∨ ¬B) → C", f: (A, B, C) => !(A || !B) || C },
  { s: "(A ∧ B) ≡ (B ∨ C)", f: (A, B, C) => (A && B) === (B || C) },
  { s: "¬(A → B) ∨ (B ∧ C)", f: (A, B, C) => !(!A || B) || (B && C) },
];

/* ================================================================ запуск Python (Skulpt) */
// Skulpt переводит Python в JavaScript и выполняет его через eval: в окне со строгой политикой это запрещено
const HOSTED_URL = "https://pythonaby-code.github.io/verdict-ok/";
let evalOk = null;
function evalAllowed() { if (evalOk === null) { try { evalOk = new Function("return 2")() === 2; } catch (e) { evalOk = false; } } return evalOk; }
let skulptState = "idle"; const skulptWaiters = [];
function loadSkulpt() {
  if (skulptState === "ready") return Promise.resolve();
  return new Promise((res, rej) => {
    skulptWaiters.push([res, rej]);
    if (skulptState === "loading") return;
    skulptState = "loading";
    const add = src => new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => { s.remove(); bad(); }; document.head.appendChild(s); });
    // сначала своя копия рядом с сайтом (не зависит от чужих серверов), потом два CDN
    const BASES = ["vendor/", "https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/", "https://unpkg.com/skulpt@1.2.0/dist/"];
    const tryFrom = i => i >= BASES.length ? Promise.reject(new Error("no skulpt"))
      : add(BASES[i] + "skulpt.min.js").then(() => add(BASES[i] + "skulpt-stdlib.js")).catch(() => tryFrom(i + 1));
    tryFrom(0)
      .then(() => { skulptState = "ready"; skulptWaiters.splice(0).forEach(w => w[0]()); document.dispatchEvent(new Event("skulpt-ready")); },
            e => { skulptState = "idle"; skulptWaiters.splice(0).forEach(w => w[1](e)); });
  });
}
function runPython(src, input, limitMs = 6000) {
  const lines = input.replace(/\r/g, "").split("\n"); let li = 0; let out = "";
  Sk.configure({
    output: t => { out += t; if (out.length > 2e6) throw new Error("Слишком большой вывод"); },
    read: x => { if (Sk.builtinFiles === undefined || Sk.builtinFiles.files[x] === undefined) throw "File not found: '" + x + "'"; return Sk.builtinFiles.files[x]; },
    inputfun: () => { if (li >= lines.length) throw new Sk.builtin.EOFError("EOF when reading a line"); return lines[li++]; },
    inputfunTakesPrompt: true,
    __future__: Sk.python3,
    execLimit: limitMs,
    yieldLimit: 100,
    killableWhile: true, killableFor: true,
  });
  const t0 = performance.now();
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, src, true))
    .then(() => ({ status: "ok", out, ms: performance.now() - t0 }),
          err => {
            const name = err && err.tp$name || "";
            let msg = err && err.toString ? err.toString() : String(err);
            const status = name === "TimeLimitError" ? "tle" : name === "SyntaxError" || name === "IndentationError" || name === "TokenError" ? "ce" : "re";
            return { status, out, ms: performance.now() - t0, msg, name };
          });
}
function sameOutput(got, exp) {
  const a = got.trim().split(/\s+/).filter(Boolean), b = exp.trim().split(/\s+/).filter(Boolean);
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) {
    if (a[i] === b[i]) continue;
    if (/\./.test(b[i]) && /^-?\d+(\.\d+)?$/.test(b[i]) && /^-?\d+(\.\d+)?(e-?\d+)?$/i.test(a[i]) && Math.abs(parseFloat(a[i]) - parseFloat(b[i])) <= 1.01 * 10 ** -(b[i].split(".")[1].length)) continue;
    return false;
  }
  return true;
}

/* ---------- пробный тур */
function tourBlock() {
  const t = S.tour;
  if (!t) return `
    <div class="row" style="justify-content:space-between">
      <div class="stack" style="gap:6px"><h2>Пробный тур</h2><p class="muted">Четыре задачи по силам ${S.grade ? S.grade + " классу" : "старшим классам"} (три по алгоритмам, одна по ИИ) и два часа. Таймер видно в шапке. Тренирует главное: распределять время.</p></div>
      <button class="btn primary" id="tourStart">Начать тур на 2 часа</button>
    </div>`;
  const left = t.start + t.dur - Date.now(), over = left <= 0 || t.done;
  const solvedIn = t.ids.filter(id => S.solved[id] && S.solved[id] >= t.start && S.solved[id] <= t.start + t.dur);
  return `
    <div class="row" style="justify-content:space-between">
      <h2>${over ? "Тур завершён" : "Идёт пробный тур"}</h2>
      <span class="mono" style="font-size:1.1rem">${over ? `решено ${solvedIn.length} из ${t.ids.length}` : "осталось " + fmtLeft(left)}</span>
    </div>
    <div class="tbl-wrap"><table><tr><th>Задача</th><th>Раздел</th><th>Сложность</th><th>Статус</th></tr>
      ${t.ids.map(id => { const k = TASK[id]; const ok = solvedIn.includes(id); return `<tr><td><a class="task-link" href="#task-${id}">${esc(k.title)}</a></td><td class="muted">${SECTIONS[k.sec].name}</td><td>${levelDots(k.level)}</td><td>${ok ? verdictPill("ok") : `<span class="pill v-none">${S.tries[id] ? S.tries[id] + " попыт." : "—"}</span>`}</td></tr>`; }).join("")}
    </table></div>
    <div class="row">${over ? `<button class="btn primary" id="tourStart">Новый тур</button><button class="btn" id="tourClose">Убрать</button>` : `<button class="btn" id="tourEnd">Завершить досрочно</button>`}</div>`;
}
function fmtLeft(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function bindTour() {
  const b = $("#tourStart");
  if (b) b.onclick = () => {
    const pickT = (f, n) => { const all = TASKS.filter(f); const fresh = all.filter(t => !S.solved[t.id]); return shuffle(fresh.length >= n ? fresh : all).slice(0, n); };
    const g = G(), near = t => fits(t) && t.g >= g - 2;
    const algo = pickT(t => t.sec === "algo" && near(t), 3);
    const ids = [...algo, ...pickT(t => t.sec === "algo" && fits(t) && !algo.includes(t), 3 - algo.length), ...pickT(t => t.sec === "ai" && near(t), 1)]
      .sort((a, b) => a.sec.localeCompare(b.sec) || a.g - b.g || a.level - b.level).map(t => t.id);
    S.tour = { start: Date.now(), dur: 2 * 3600 * 1000, ids, done: false }; save(); render();
  };
  const e = $("#tourEnd"); if (e) e.onclick = () => { S.tour.done = true; S.tour.dur = Date.now() - S.tour.start; save(); render(); };
  const c = $("#tourClose"); if (c) c.onclick = () => { S.tour = null; save(); render(); };
}
function updateTourChip() {
  const chip = $("#tourChip"), t = S.tour;
  if (!t || t.done || Date.now() > t.start + t.dur) { chip.hidden = true; return; }
  chip.hidden = false; chip.textContent = "тур " + fmtLeft(t.start + t.dur - Date.now());
}
setInterval(() => {
  updateTourChip();
  if (route.view === "home" && S.tour && !S.tour.done) { const el = $("#tour"); if (el && !el.contains(document.activeElement)) { el.innerHTML = tourBlock(); bindTour(); } }
}, 1000);

function renderTrainer(sec, body) {
  const st = trainerState[sec] || (trainerState[sec] = { gen: "mix", q: null, answered: false, streak: 0, session: { ok: 0, all: 0 } });
  const gens = GENS[sec];
  body.innerHTML = `

      ${gens.some(g => !fits(g)) ? `<span class="gen-sep">Для старших</span>${gens.filter(g => !fits(g)).map(g => `<button data-gen="${g.id}" aria-pressed="${st.gen === g.id}" class="older">${g.name} · ${g.g}+</button>`).join("")}` : ""}
    </div>

      <div class="score"><span>Сейчас: <b>${st.session.ok}/${st.session.all}</b></span><span>Серия: <b>${st.streak}</b></span><span>Всего верных в разделе: <b>${S.quiz[sec].ok}</b></span></div>
      <div class="sheet qcard" id="qcard"></div>
    </div>
  </div>`;
  $$("[data-gen]", body).forEach(b => b.onclick = () => { st.gen = b.dataset.gen; st.q = null; renderTrainer(sec, body); });
  if (!st.q) newQuestion(sec);
  drawQuestion(sec, body);
  const on = $('[data-gen][aria-pressed="true"]', body), list = on && on.parentElement;
  if (on && list.scrollWidth > list.clientWidth) list.scrollLeft = on.offsetLeft - list.offsetLeft - 16;
}
function newQuestion(sec) {
  const st = trainerState[sec];
  const g = st.gen === "mix" ? pick(GENS[sec].filter(fits)) : GENS[sec].find(x => x.id === st.gen);
  st.q = { ...g.make(), genName: g.name }; st.answered = false; st.user = null;
}
function checkAnswer(q, raw) {
  const s = String(raw).trim().replace(/\s+/g, "").replace(",", ".");
  if (q.text) return s.toUpperCase() === String(q.answer).toUpperCase() || (s.toUpperCase().replace(/^0+/, "") === String(q.answer).toUpperCase());
  const v = Number(s); if (s === "" || !isFinite(v)) return false;
  return Math.abs(v - Number(q.answer)) <= (q.tol || 1e-9);
}
function drawQuestion(sec, body) {
  const st = trainerState[sec], q = st.q, card = $("#qcard", body);
  const ansShown = typeof q.answer === "number" ? String(q.answer).replace(".", ",") : q.answer;
  card.innerHTML = `
    <span class="eyebrow">${q.genName}</span>
    <div class="qtext">${q.html}</div>
    ${q.kind === "choice"
      ? `<div class="choices">${q.options.map((o, i) => `<button data-i="${i}" ${st.answered ? "disabled" : ""} class="${st.answered ? (i === q.correct ? "is-right" : i === st.user ? "is-wrong" : "") : ""}">${o}</button>`).join("")}</div>`
      : `<form class="answer-row" id="ansForm"><input id="ans-${sec}" autocomplete="off" inputmode="${q.text ? "text" : "decimal"}" placeholder="Ваш ответ" value="${st.user != null ? esc(st.user) : ""}" ${st.answered ? "readonly" : ""} aria-label="Ответ"><button class="btn primary" ${st.answered ? "disabled" : ""}>Проверить</button></form>`}
    ${st.answered ? `<div class="feedback ${st.right ? "good" : "bad"}"><span class="fh">${st.right ? "Верно" : q.kind === "choice" ? "Неверно" : `Неверно. Правильный ответ: ${esc(ansShown)}`}</span><div>${q.explain}</div></div>
      <div class="row"><button class="btn primary" id="nextQ">Следующая задача →</button></div>` : ""}`;
  const finish = (right, user) => {
    st.answered = true; st.right = right; st.user = user;
    st.session.all++; S.quiz[sec].all++;
    if (right) { st.session.ok++; S.quiz[sec].ok++; st.streak++; } else st.streak = 0;
    save(); renderTrainer(sec, body); const nb = $("#nextQ"); if (nb) nb.focus({ preventScroll: true });
  };
  if (q.kind === "choice") $$(".choices button", card).forEach(b => b.onclick = () => { const i = +b.dataset.i; finish(i === q.correct, i); });
  else {
    const f = $("#ansForm", card);
    f.onsubmit = e => { e.preventDefault(); const v = $("input", f).value; if (!v.trim()) { $("input", f).focus(); return; } finish(checkAnswer(q, v), v); };
    if (!st.answered) setTimeout(() => { const i = $("input", f); if (i && route.view === "sec") i.focus({ preventScroll: true }); }, 0);
  }
  const nb = $("#nextQ", card); if (nb) nb.onclick = () => { newQuestion(sec); renderTrainer(sec, body); };
}

function letterOf(t) { const i = TASKS.filter(x => x.sec === t.sec).indexOf(t); return i < 26 ? String.fromCharCode(65 + i) : "A" + String.fromCharCode(65 + i - 26); }
function starterCode(t) {

}
function renderTask(t) {
  const sec = SECTIONS[t.sec], list = TASKS.filter(x => x.sec === t.sec), idx = list.indexOf(t);
  const samples = t.tests.slice(0, t.tests[1] && t.tests[1].in.length < 80 ? 2 : 1);
  const saved = S.code[t.id] != null ? S.code[t.id] : starterCode(t);
  const prev = list[idx - 1], next = list[idx + 1];
  app.innerHTML = `
  <div class="row" style="justify-content:space-between">

    <div class="row">${prev ? `<a class="btn small" href="#task-${prev.id}">← ${letterOf(prev)}</a>` : ""}${next ? `<a class="btn small" href="#task-${next.id}">${letterOf(next)} →</a>` : ""}</div>
  </div>
  <div class="task-grid">
    <article class="sheet statement">
      <p class="eyebrow">Задача ${letterOf(t)} · ${t.topic}</p>
      <h1>${esc(t.title)}</h1>
      <div class="row"><span class="gchip">${gLabel(t.g)}</span>${levelDots(t.level)}<span class="limits">ограничение времени 6 с (Python в браузере) · тестов: ${t.tests.length}</span>${S.solved[t.id] ? verdictPill("ok") : ""}</div>
      <p>${t.text}</p>

      <h3>Выходные данные</h3><p>${t.out}</p>
      <h3>${samples.length > 1 ? "Примеры" : "Пример"}</h3>
      ${samples.map(s => `<div class="sample"><div><div class="cap">ввод</div><pre>${esc(s.in)}</pre></div><div><div class="cap">вывод</div><pre>${esc(s.out)}</pre></div></div>`).join("")}
      <div class="reveal" id="reveal"></div>
    </article>
    <section class="ide">
      <div class="editor"><div class="gut" id="gut" aria-hidden="true">1</div><textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Код решения на Python">${esc(saved)}</textarea></div>
      <div class="row">
        <button class="btn primary" id="submit">Отправить на проверку</button>
        <button class="btn" id="runBtn">Запустить на своём вводе</button>
        <span class="muted" id="pyState" style="font-size:.85rem"></span>
      </div>
      <div class="io">
        <div><div class="cap">свой ввод</div><textarea id="stdin" spellcheck="false" aria-label="Ввод для запуска">${esc(samples[0].in)}</textarea></div>
        <div><div class="cap">вывод программы</div><pre id="stdout" aria-live="polite"> </pre></div>
      </div>
      <div class="sheet verdict" id="verdict" hidden></div>
    </section>
  </div>`;
  const ed = $("#editor"), gut = $("#gut");
  const syncGut = () => { const n = ed.value.split("\n").length; gut.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n"); gut.scrollTop = ed.scrollTop; };
  syncGut();
  ed.addEventListener("scroll", () => { gut.scrollTop = ed.scrollTop; });
  ed.addEventListener("input", () => { syncGut(); S.code[t.id] = ed.value; save(); });
  ed.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.ctrlKey && !e.altKey) {
      e.preventDefault(); const s = ed.selectionStart, en = ed.selectionEnd;
      if (e.shiftKey) {
        const ls = ed.value.lastIndexOf("\n", s - 1) + 1; const m = ed.value.slice(ls).match(/^ {1,4}/);
        if (m) { ed.setRangeText("", ls, ls + m[0].length, "end"); ed.selectionStart = ed.selectionEnd = Math.max(ls, s - m[0].length); }
      } else ed.setRangeText("    ", s, en, "end");
      ed.dispatchEvent(new Event("input"));
    } else if (e.key === "Enter" && !e.ctrlKey) {
      e.preventDefault(); const s = ed.selectionStart; const ls = ed.value.lastIndexOf("\n", s - 1) + 1;
      const line = ed.value.slice(ls, s); let ind = line.match(/^\s*/)[0]; if (/:\s*$/.test(line)) ind += "    ";
      ed.setRangeText("\n" + ind, s, ed.selectionEnd, "end"); ed.dispatchEvent(new Event("input"));
    } else if (e.key === ":" && !e.ctrlKey) {
      // else / elif / except / finally встают на уровень своего if или try
      const s = ed.selectionStart, ls = ed.value.lastIndexOf("\n", s - 1) + 1, line = ed.value.slice(ls, s);
      const open = (line.match(/[\[(]/g) || []).length, close = (line.match(/[\])]/g) || []).length;
      if (open === close && /^ {4,}(else|elif\b.*|except\b.*|finally)$/.test(line)) {
        e.preventDefault();
        ed.setRangeText(line.slice(4) + ":", ls, ed.selectionEnd, "end");
        ed.dispatchEvent(new Event("input"));
      }
    } else if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); $("#submit").click(); }
  });
  drawReveal(t);
  const pyState = $("#pyState");
  const setBusy = (busy, msg) => { $("#submit").disabled = busy; $("#runBtn").disabled = busy; pyState.textContent = msg || ""; };
  const ensure = async () => {
    if (!evalAllowed()) {
      const vbox = $("#verdict"); vbox.hidden = false;
      vbox.innerHTML = `<div class="big"><span class="pill v-tle">!</span><b>В этом окне нельзя запускать Python</b></div><p>Браузер открыл сайт в защищённом режиме и запрещает выполнять код. Теория, тренажёр и лаборатория работают, а для проверки задач откройте версию сайта с проверкой.${HOSTED_URL ? ` Вот она: <a href="${HOSTED_URL}#task-${t.id}" target="_blank" rel="noopener">${HOSTED_URL}</a>` : ""}</p>`;
      return false;
    }
    if (skulptState !== "ready") { setBusy(true, "Загружаю Python…"); try { await loadSkulpt(); } catch (e) { setBusy(false, "Не удалось загрузить Python. Проверьте интернет и нажмите ещё раз."); return false; } }
    return true;
  };
  $("#runBtn").onclick = async () => {
    if (!(await ensure())) return;
    setBusy(true, "Выполняется…"); const r = await runPython(ed.value, $("#stdin").value);
    $("#stdout").textContent = r.out + (r.status === "ok" ? "" : (r.out ? "\n" : "") + (r.status === "tle" ? "Превышено время (6 с). Нет ли бесконечного цикла?" : r.msg));
    setBusy(false, r.status === "ok" ? `готово за ${Math.round(r.ms)} мс` : "");
  };
  $("#submit").onclick = async () => {
    if (!(await ensure())) return;
    const vbox = $("#verdict"); vbox.hidden = false;
    const res = [];
    const paint = (final) => {
      const first = res.findIndex(r => r.v !== "ok");
      const v = !final ? null : first === -1 ? "ok" : res[first].v;
      vbox.innerHTML = `
        <div class="big">${final ? verdictPill(v) : `<span class="pill v-none">…</span>`}<b>${final ? (v === "ok" ? "Принято! Все тесты пройдены." : `${VERDICT[v][1]} на тесте ${first + 1}`) : `Проверка: тест ${res.length + 1} из ${t.tests.length}`}</b></div>
        <div class="tests">${t.tests.map((_, i) => `<span class="${res[i] ? "v-" + res[i].v : "v-none"}" title="Тест ${i + 1}">${i + 1}</span>`).join("")}</div>
        ${final && first !== -1 ? failBox(t, first, res[first]) : ""}`;
    };
    setBusy(true, "Проверяю…"); paint(false);
    if (res.length === 0) {
      for (let i = 0; i < t.tests.length; i++) {
        const r = await runPython(ed.value, t.tests[i].in);
        let v = r.status === "ok" ? (sameOutput(r.out, t.tests[i].out) ? "ok" : "wa") : r.status;
        res.push({ v, r });
        paint(false);
        if (v === "ce") { for (let j = i + 1; j < t.tests.length; j++) res.push({ v: "ce", r }); break; }
        if (v === "tle") break;
      }
    }
    const passed = res.filter(x => x.v === "ok").length, allOk = passed === t.tests.length;
    if (allOk) { if (!S.solved[t.id]) S.solved[t.id] = Date.now(); } else S.tries[t.id] = (S.tries[t.id] || 0) + 1;
    const first = res.findIndex(r => r.v !== "ok");
    S.hist.push({ t: Date.now(), id: t.id, v: allOk ? "ok" : res[first].v, passed, total: t.tests.length }); if (S.hist.length > 60) S.hist.shift();
    save(); paint(true); setBusy(false, ""); drawReveal(t);
  };
  if (skulptState !== "ready") { pyState.textContent = "Python загружается…"; loadSkulpt().then(() => { if ($("#pyState") === pyState && !$("#submit").disabled) pyState.textContent = ""; }, () => { pyState.textContent = "Python не загрузился. Нажмите «Отправить», чтобы попробовать снова."; }); }
}
function failBox(t, i, x) {
  const shown = s => esc(s.length > 600 ? s.slice(0, 600) + "\n…" : s);
  if (x.v === "ce" || x.v === "re") {
    return `<div class="fail-box"><span>${explainErr(x.r.msg) || "Программа завершилась с ошибкой."}</span><pre>${esc(x.r.msg || "")}</pre></div>`;
  }
  if (x.v === "tle") return `<div class="fail-box"><span>Программа не уложилась в 6 секунд. Либо в ней бесконечный цикл, либо алгоритм слишком медленный для таких ограничений: посмотрите на сложность.</span><div class="cap muted mono" style="font-size:.75rem">ВВОД ТЕСТА ${i + 1}</div><pre>${shown(t.tests[i].in)}</pre></div>`;
  return `<div class="fail-box">
    <div class="cap muted mono" style="font-size:.75rem">ВВОД ТЕСТА ${i + 1}</div><pre>${shown(t.tests[i].in)}</pre>
    <div class="sample"><div><div class="cap">ожидалось</div><pre>${shown(t.tests[i].out)}</pre></div><div><div class="cap">ваш вывод</div><pre>${shown(x.r.out.trim() || "(пусто)")}</pre></div></div>
  </div>`;
}
function drawReveal(t) {
  const box = $("#reveal"); if (!box) return;
  const tries = S.tries[t.id] || 0, solved = !!S.solved[t.id], open = S.reveal[t.id];
  const hintOpen = S.reveal[t.id + ":hint"];
  let h = `<h3>Помощь</h3>`;
  h += hintOpen ? `<div class="note"><b>Подсказка.</b> ${t.hint}</div>` : `<div class="row"><button class="btn small" id="hintBtn">Показать подсказку</button></div>`;
  if (open || solved) {
    h += `<div class="stack" style="gap:10px"><b>Разбор</b><p>${t.why}</p>${code(t.solution)}</div>`;
  } else if (tries >= 2) {
    h += `<div class="row"><button class="btn small" id="solBtn">Показать разбор и решение</button></div>`;
  } else {
    h += `<p class="muted" style="font-size:.9rem">Разбор откроется после решения или после двух попыток. Сначала попробуйте сами: так запоминается лучше.</p>`;
  }
  box.innerHTML = h;
  const hb = $("#hintBtn"); if (hb) hb.onclick = () => { S.reveal[t.id + ":hint"] = 1; save(); drawReveal(t); };
  const sb = $("#solBtn"); if (sb) sb.onclick = () => {
    sb.parentElement.outerHTML = `<div class="confirm" id="cf"><span>Точно открыть? После этого задачу стоит перерешать завтра без подсказки.</span><button class="btn small" id="cfYes">Открыть</button><button class="btn small" id="cfNo">Ещё попробую</button></div>`;
    $("#cfYes").onclick = () => { S.reveal[t.id] = 1; save(); drawReveal(t); };
    $("#cfNo").onclick = () => drawReveal(t);
  };
}

/* ---------- лаборатория ИИ */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const labs = { knn: null, gd: null };
function renderLab(body) {
  body.innerHTML = `
  <div class="stack" style="gap:24px">
    <div class="sheet lab">
      <div class="stack" style="gap:6px"><h2>k ближайших соседей</h2><p class="muted">Нажимайте на поле, чтобы добавить точки выбранного класса. Фон показывает, какой класс модель предскажет в каждом месте. Двигайте k и смотрите, как граница становится гладкой или рваной.</p></div>
      <div class="ctrl">
        <div class="seg" role="group" aria-label="Класс новой точки">
          <button id="clsA" aria-pressed="true"><span class="dot" style="background:var(--cls-a)"></span>Класс A</button>
          <button id="clsB" aria-pressed="false"><span class="dot" style="background:var(--cls-b)"></span>Класс B</button>
        </div>
        <label>k = <b class="mono" id="kVal">3</b><input type="range" id="kRange" min="1" max="15" step="2" value="3"></label>
        <button class="btn small" id="knnRand">Новые данные</button>
        <button class="btn small" id="knnNoise">Добавить шум</button>
        <button class="btn small" id="knnClear">Очистить</button>
      </div>
      <canvas id="knnCv" aria-label="Поле классификации k-NN"></canvas>
      <p class="status-line muted" id="knnInfo"></p>
    </div>
    <div class="sheet lab">
      <div class="stack" style="gap:6px"><h2>Градиентный спуск</h2><p class="muted">Ищем минимум f(w) = (w − 3)². Каждая точка — один шаг w ← w − η·2(w − 3). Подберите шаг обучения η: когда спуск плавный, когда прыгает через минимум, а когда улетает.</p></div>
      <div class="ctrl">
        <label>η = <b class="mono" id="etaVal">0.10</b><input type="range" id="eta" min="0.01" max="1.1" step="0.01" value="0.1"></label>
        <label>старт w₀ = <b class="mono" id="w0Val">−3</b><input type="range" id="w0" min="-4" max="10" step="0.5" value="-3"></label>
      </div>
      <canvas id="gdCv" aria-label="График градиентного спуска"></canvas>
      <p class="status-line" id="gdInfo"></p>
    </div>
  </div>`;
  initKnn(); initGd();
}
function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h };
}
function sampleKnn() {
  const pts = [];
  for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * 0.17; pts.push({ x: 0.3 + Math.cos(a) * r, y: 0.38 + Math.sin(a) * r * 1.2, c: 0 }); }
  for (let i = 0; i < 18; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * 0.17; pts.push({ x: 0.68 + Math.cos(a) * r, y: 0.62 + Math.sin(a) * r * 1.2, c: 1 }); }
  return pts;
}
function initKnn() {
  const st = labs.knn || (labs.knn = { pts: sampleKnn(), k: 3, cls: 0 });
  const cv = $("#knnCv");
  const predict = (x, y) => {
    if (!st.pts.length) return -1;
    const d = st.pts.map(p => [(p.x - x) ** 2 + (p.y - y) ** 2, p.c]).sort((a, b) => a[0] - b[0]).slice(0, Math.min(st.k, st.pts.length));
    const a = d.filter(z => z[1] === 0).length; return a * 2 > d.length ? 0 : a * 2 < d.length ? 1 : d[0][1];
  };
  const draw = () => {
    const { ctx, w, h } = fitCanvas(cv); const ca = css("--cls-a"), cb = css("--cls-b");
    ctx.clearRect(0, 0, w, h); const step = 8;
    ctx.globalAlpha = 0.16;
    for (let x = 0; x < w; x += step) for (let y = 0; y < h; y += step) { const c = predict((x + step / 2) / w, (y + step / 2) / h); if (c < 0) continue; ctx.fillStyle = c ? cb : ca; ctx.fillRect(x, y, step, step); }
    ctx.globalAlpha = 1;
    let wrong = 0;
    for (const p of st.pts) {
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 5.5, 0, Math.PI * 2); ctx.fillStyle = p.c ? cb : ca; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = css("--sheet"); ctx.stroke();
    }
    // точность «оставь-одного»: каждую точку классифицируем по остальным
    for (let i = 0; i < st.pts.length; i++) {
      const p = st.pts[i]; const others = st.pts.filter((_, j) => j !== i);
      if (!others.length) continue;
      const d = others.map(o => [(o.x - p.x) ** 2 + (o.y - p.y) ** 2, o.c]).sort((a, b) => a[0] - b[0]).slice(0, Math.min(st.k, others.length));
      const a = d.filter(z => z[1] === 0).length; const pr = a * 2 > d.length ? 0 : a * 2 < d.length ? 1 : d[0][1];
      if (pr !== p.c) wrong++;
    }
    const n = st.pts.length;
    $("#knnInfo").textContent = n < 2 ? "Добавьте хотя бы по одной точке каждого класса." : `Точек: ${n}. Проверка «оставь одного» (каждую точку предсказываем по остальным): верно ${n - wrong} из ${n}, accuracy ${((n - wrong) / n).toFixed(2)}.`;
  };
  const setCls = c => { st.cls = c; $("#clsA").setAttribute("aria-pressed", c === 0); $("#clsB").setAttribute("aria-pressed", c === 1); };
  setCls(st.cls); $("#kRange").value = st.k; $("#kVal").textContent = st.k;
  $("#clsA").onclick = () => setCls(0); $("#clsB").onclick = () => setCls(1);
  $("#kRange").oninput = e => { st.k = +e.target.value; $("#kVal").textContent = st.k; draw(); };
  $("#knnRand").onclick = () => { st.pts = sampleKnn(); draw(); };
  $("#knnNoise").onclick = () => { for (let i = 0; i < 6; i++) st.pts.push({ x: Math.random() * 0.9 + 0.05, y: Math.random() * 0.9 + 0.05, c: ri(0, 1) }); draw(); };
  $("#knnClear").onclick = () => { st.pts = []; draw(); };
  cv.onclick = e => { const r = cv.getBoundingClientRect(); st.pts.push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height, c: st.cls }); draw(); };
  labs.knnDraw = draw; draw();
}
function initGd() {
  const st = labs.gd || (labs.gd = { eta: 0.1, w0: -3 });
  const cv = $("#gdCv"); const f = w => (w - 3) ** 2;
  const draw = () => {
    const { ctx, w, h } = fitCanvas(cv);
    const pad = { l: 40, r: 14, t: 14, b: 30 }, X0 = -4, X1 = 10, Y1 = 50;
    const sx = v => pad.l + (v - X0) / (X1 - X0) * (w - pad.l - pad.r), sy = v => h - pad.b - v / Y1 * (h - pad.t - pad.b);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = css("--line"); ctx.lineWidth = 1; ctx.fillStyle = css("--muted"); ctx.font = `11px ${css("--f-mono")}`;
    for (let v = -4; v <= 10; v += 2) { ctx.beginPath(); ctx.moveTo(sx(v), pad.t); ctx.lineTo(sx(v), h - pad.b); ctx.stroke(); ctx.textAlign = "center"; ctx.fillText(String(v).replace("-", "−"), sx(v), h - pad.b + 16); }
    for (let v = 0; v <= 50; v += 10) { ctx.beginPath(); ctx.moveTo(pad.l, sy(v)); ctx.lineTo(w - pad.r, sy(v)); ctx.stroke(); ctx.textAlign = "right"; ctx.fillText(v, pad.l - 6, sy(v) + 4); }
    ctx.textAlign = "left"; ctx.fillText("w", w - pad.r - 10, h - pad.b - 6);
    ctx.save(); ctx.beginPath(); ctx.rect(pad.l, pad.t, w - pad.l - pad.r, h - pad.t - pad.b); ctx.clip();
    ctx.beginPath(); for (let i = 0; i <= 200; i++) { const v = X0 + (X1 - X0) * i / 200; i ? ctx.lineTo(sx(v), sy(f(v))) : ctx.moveTo(sx(v), sy(f(v))); }
    ctx.strokeStyle = css("--muted"); ctx.lineWidth = 2; ctx.stroke();
    const ws = [st.w0]; for (let i = 0; i < 25; i++) { const nw = ws[ws.length - 1] - st.eta * 2 * (ws[ws.length - 1] - 3); ws.push(nw); if (Math.abs(nw) > 1e6) break; }
    ctx.strokeStyle = css("--pen"); ctx.lineWidth = 1.5; ctx.beginPath();
    ws.forEach((v, i) => i ? ctx.lineTo(sx(v), sy(f(v))) : ctx.moveTo(sx(v), sy(f(v)))); ctx.stroke();
    ws.forEach((v, i) => { ctx.beginPath(); ctx.arc(sx(v), sy(f(v)), i ? 4 : 6, 0, Math.PI * 2); ctx.fillStyle = i ? css("--pen") : css("--tle"); ctx.fill(); });
    ctx.restore();
    const k = 1 - 2 * st.eta; let msg, cls;
    const conv = ws.findIndex(v => Math.abs(v - 3) < 0.01);
    if (Math.abs(k) > 1) { msg = `η = ${st.eta.toFixed(2)} > 1: каждый шаг уводит дальше от минимума, спуск расходится.`; cls = "--wa"; }
    else if (Math.abs(k) === 1) { msg = `η = ${st.eta.toFixed(2)}: точка прыгает между двумя значениями и не приближается к минимуму.`; cls = "--tle"; }
    else if (k < 0) { msg = `η = ${st.eta.toFixed(2)}: шаг великоват, точка перепрыгивает минимум туда-обратно, но сходится${conv >= 0 ? ` за ${conv} шаг.` : "."}`; cls = "--tle"; }
    else if (k === 0) { msg = `η = 0.50: идеальный шаг для этой функции, минимум найден за 1 шаг.`; cls = "--ok"; }
    else { msg = conv >= 0 ? `η = ${st.eta.toFixed(2)}: плавный спуск, до минимума w = 3 за ${conv} шаг.` : `η = ${st.eta.toFixed(2)}: шаг маленький, за 25 шагов дошли только до w = ${ws[25].toFixed(2)}.`; cls = conv >= 0 ? "--ok" : "--tle"; }
    const info = $("#gdInfo"); info.textContent = msg.replace(/за (\d+) шаг/, (m, n) => `за ${n} ${plural(+n, "шаг", "шага", "шагов")}`); info.style.color = `var(${cls})`;
  };
  $("#eta").value = st.eta; $("#w0").value = st.w0;
  const upd = () => { st.eta = +$("#eta").value; st.w0 = +$("#w0").value; $("#etaVal").textContent = st.eta.toFixed(2); $("#w0Val").textContent = String(st.w0).replace("-", "−"); draw(); };
  $("#eta").oninput = upd; $("#w0").oninput = upd; labs.gdDraw = draw; upd();
}
const redrawLabs = () => { if (route.view === "sec" && route.tab === "lab") { labs.knnDraw && labs.knnDraw(); labs.gdDraw && labs.gdDraw(); } };
window.addEventListener("resize", redrawLabs);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(redrawLabs, 30));
new MutationObserver(() => setTimeout(redrawLabs, 30)).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- самопроверка эталонных решений (для разработчика: window.__selfTest()) */
window.__selfTest = async () => {
  await loadSkulpt(); const bad = [];
  for (const t of TASKS) for (let i = 0; i < t.tests.length; i++) {
    const r = await runPython(t.solution, t.tests[i].in, 20000);
    if (r.status !== "ok" || !sameOutput(r.out, t.tests[i].out)) bad.push({ id: t.id, test: i + 1, status: r.status, msg: r.msg, got: r.out.slice(0, 80), exp: t.tests[i].out.slice(0, 80), ms: Math.round(r.ms) });
  }
  return bad;
};

$("#gradeSel").value = S.grade || "";
$("#gradeSel").onchange = e => setGrade(e.target.value);
